version: '3.8'

services:
  bot:
    image: ghcr.io/anigx/discord-release-bot-python:latest
    container_name: discord-release-bot
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DATA_DIR=/app/data
    restart: unless-stopped
    pull_policy: always
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
